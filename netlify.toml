[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  VITE_CLOUD_MODE = "true"
  VITE_DEPLOYMENT_MODE = "free"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist", "@napi-rs/canvas"]
  included_files = ["node_modules/pdfjs-dist/**", "node_modules/@napi-rs/canvas*/**"]

[functions."career-backup"]
  schedule = "0 18 * * *"

# Preview origins never ship the production API or scheduled backup code.
[context.deploy-preview]
  command = "npm run build:preview"
  publish = ".preview-dist"
  functions = "netlify/preview-functions"

[context.branch-deploy]
  command = "npm run build:preview"
  publish = ".preview-dist"
  functions = "netlify/preview-functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/career-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.run.app https://*.firebaseapp.com https://*.web.app; frame-src 'self' https://*.firebaseapp.com https://*.web.app https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/imports/*.bin"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
